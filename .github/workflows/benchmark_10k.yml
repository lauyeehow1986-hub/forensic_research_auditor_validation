name: Forensic Research Auditor CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  validate-forensic-auditor:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Forensic Math Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Deterministic Forensic Math & Ledger Test Suite
        run: |
          python -m pytest tests/test_forensic_math_suite.py -v

      - name: Assert Historical Pilot Full-Text Audit Integrity
        run: |
          python3 -c '
          import os, json
          ledger_path = os.path.join("data", "extracted_tables", "real_100_fulltext_blind_ledger.jsonl")
          assert os.path.exists(ledger_path), "Blind ledger missing!"
          with open(ledger_path, "r", encoding="utf-8") as f:
              records = [json.loads(line) for line in f if line.strip()]
          assert len(records) == 100, f"Expected 100 studies, got {len(records)}"
          cases = [r for r in records if r.get("cohort") == "CASE"]
          controls = [r for r in records if r.get("cohort") == "CONTROL"]
          assert len(cases) == 50, f"Expected 50 cases, got {len(cases)}"
          assert len(controls) == 50, f"Expected 50 controls, got {len(controls)}"
          clean_controls = [r for r in controls if r.get("blind_verdict") == "CLEAN"]
          spec = len(clean_controls) / len(controls)
          assert spec >= 0.90, f"Expected specificity >= 90%, got {spec:.2%}"
          tier1 = [r for r in cases if r.get("retraction_tier") == "TIER_1_MATH_DATA"]
          t1_flagged = [r for r in tier1 if r.get("blind_verdict") == "FLAGGED_FORENSIC_ANOMALY"]
          sens = len(t1_flagged) / len(tier1)
          assert sens >= 0.70, f"Expected Tier 1 sensitivity >= 70%, got {sens:.2%}"
          print(f"SUCCESS: Blind audit verified (Tier 1 Sens={sens:.2%}, Control Spec={spec:.2%})")
          '

      - name: Assert Blind 2,000-Study Full-Text Audit Integrity
        run: |
          python3 -c '
          import os, json
          ledger_path = os.path.join("data", "extracted_tables", "real_2000_fulltext_blind_ledger.jsonl")
          assert os.path.exists(ledger_path), "2000-study ledger missing!"
          with open(ledger_path, "r", encoding="utf-8") as f:
              records = [json.loads(line) for line in f if line.strip()]
          assert len(records) == 2000, f"Expected 2000 studies, got {len(records)}"
          cases = [r for r in records if r.get("cohort") == "CASE"]
          controls = [r for r in records if r.get("cohort") == "CONTROL"]
          assert len(cases) == 1000, f"Expected 1000 cases, got {len(cases)}"
          assert len(controls) == 1000, f"Expected 1000 controls, got {len(controls)}"
          clean_controls = [r for r in controls if r.get("blind_verdict") == "CLEAN"]
          spec = len(clean_controls) / len(controls)
          assert spec >= 0.80, f"Expected specificity >= 80%, got {spec:.2%}"
          tier1 = [r for r in cases if r.get("retraction_tier") == "GATE_3_MATH_DATA"]
          assert len(tier1) == 88, f"Expected 88 Gate 3 Math cases, got {len(tier1)}"
          t1_flagged = [r for r in tier1 if r.get("blind_verdict") == "FLAGGED_FORENSIC_ANOMALY"]
          sens = len(t1_flagged) / len(tier1)
          assert sens >= 0.20, f"Expected Gate 3 Math sensitivity >= 20%, got {sens:.2%}"
          gate4 = [r for r in cases if r.get("retraction_tier") == "GATE_4_GOVERNANCE"]
          assert len(gate4) == 761, f"Expected 761 Gate 4 cases, got {len(gate4)}"
          g4_clean = [r for r in gate4 if r.get("blind_verdict") == "CLEAN"]
          g4_spec = len(g4_clean) / len(gate4)
          assert g4_spec >= 0.75, f"Expected Gate 4 specificity >= 75%, got {g4_spec:.2%}"
          print(f"SUCCESS: 2,000-Study 5-Gate blind audit verified (Gate 3 Sens={sens:.2%}, Control Spec={spec:.2%}, Gate 4 Spec={g4_spec:.2%})")
          '

      - name: Upload Audit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forensic-audit-artifacts
          path: |
            reports/BLIND_2000_FULLTEXT_AUDIT_REPORT.md
            reports/BLIND_100_FULLTEXT_AUDIT_REPORT.md
            data/extracted_tables/real_2000_fulltext_blind_ledger.jsonl
